services:
  app:
    build: .
    ports:
      - "${SETSQUARE_BIND:-127.0.0.1}:3002:3002"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set the GitHub OAuth client ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set the GitHub OAuth secret}
      ALLOWED_GITHUB_IDS: ${ALLOWED_GITHUB_IDS:-}
      ALLOW_ANY_GITHUB_ACCOUNT: ${ALLOW_ANY_GITHUB_ACCOUNT:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DATABASE_URL: postgresql://setsquare:${POSTGRES_PASSWORD:?Set a database password}@db:5432/setsquare
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: setsquare
      POSTGRES_DB: setsquare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setsquare -d setsquare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
