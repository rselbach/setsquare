[package]
name = "setsquare-web"
description = "Setsquare web app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
setsquare-core = { path = "../setsquare-core" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DomRect", "Element", "HtmlElement", "HtmlInputElement", "Window"] }

[lints]
workspace = true
