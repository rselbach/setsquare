<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greendale enrollment system</title>
<style>
@font-face{font-family:"D-DIN";src:url("../fonts/D-DIN.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"D-DIN";src:url("../fonts/D-DIN-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"D-DIN Condensed";src:url("../fonts/D-DINCondensed.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"D-DIN Condensed";src:url("../fonts/D-DINCondensed-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"D-DIN Exp";src:url("../fonts/D-DINExp.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"D-DIN Exp";src:url("../fonts/D-DINExp-Bold.woff2") format("woff2");font-weight:700;font-display:block}

:root{
  color-scheme:light;
  --board:#DBE2DB;
  --vellum:#F3F5F1;
  --vellum-2:#E7ECE6;
  --vellum-3:#DAE1D9;
  --field:#FFFFFF;
  --sheet:#FFFFFF;
  --graphite:#2A2F2B;
  --lead:#5E665F;
  --rule:#D3D9D2;
  --rule-strong:#848D85;
  --grid-minor:rgba(92,190,220,.16);
  --grid-major:rgba(92,190,220,.36);
  --guide:#2399BF;
  --ink:#0B7EA3;
  --ink-wash:rgba(11,126,163,.13);
  --redline:#C4313B;
  --on-graphite:#F3F5F1;
  --pop-shadow:0 12px 28px -10px rgba(30,40,34,.30),0 2px 4px rgba(30,40,34,.08);
  --diagram-text:#1F2421;
  --edge:#4A514C;
  --mist-f:#DCEBF2;--mist-s:#3C7A93;
  --sage-f:#E1EEDD;--sage-s:#5B8A4E;
  --ochre-f:#F7EACB;--ochre-s:#A07617;
  --rose-f:#F6DEDC;--rose-s:#A54B48;
  --lilac-f:#E9E2F2;--lilac-s:#6E5A99;
  --stone-f:#EDEEEA;--stone-s:#6B6E66;
  --font-ui:"D-DIN","Helvetica Neue",Arial,system-ui,sans-serif;
  --font-narrow:"D-DIN Condensed","Arial Narrow","D-DIN",sans-serif;
  --font-wide:"D-DIN Exp","D-DIN","Helvetica Neue",sans-serif;
  --font-diagram:Helvetica,Arial,sans-serif;
  --r-control:3px;
  --r-pop:6px;
  --lib-w:240px;
  --insp-w:280px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --board:#161D1A;
  --vellum:#1F2724;
  --vellum-2:#28322E;
  --vellum-3:#323D38;
  --field:#171E1B;
  --sheet:#232B27;
  --graphite:#E2E8E3;
  --lead:#97A39A;
  --rule:#303A35;
  --rule-strong:#66726B;
  --grid-minor:rgba(95,199,230,.10);
  --grid-major:rgba(95,199,230,.22);
  --guide:#4CC3E6;
  --ink:#5CC8EA;
  --ink-wash:rgba(92,200,234,.16);
  --redline:#F06A70;
  --on-graphite:#161D1A;
  --pop-shadow:0 14px 30px -10px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.3);
  --diagram-text:#E2E8E3;
  --edge:#AEB8B1;
  --mist-f:#1E3440;--mist-s:#6FB3CF;
  --sage-f:#22362A;--sage-s:#8DC07E;
  --ochre-f:#3A3220;--ochre-s:#D9B05A;
  --rose-f:#40292A;--rose-s:#E08F8B;
  --lilac-f:#312B41;--lilac-s:#B7A2E0;
  --stone-f:#2C322F;--stone-s:#A3ABA5;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 13px/18px var(--font-ui);color:var(--graphite);background:var(--vellum);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
svg{display:block}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;height:100vh;height:100dvh;grid-template-columns:var(--lib-w) minmax(0,1fr) var(--insp-w);grid-template-rows:48px minmax(0,1fr);grid-template-areas:"top top top" "lib stage insp"}

/* top bar */
.topbar{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 10px}
.tb-left,.tb-right{display:flex;align-items:center;gap:4px;min-width:0}
.tb-right{justify-content:flex-end;gap:8px}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:var(--r-control);background:none;color:var(--graphite)}
.iconbtn:hover{background:var(--vellum-2)}
.iconbtn[aria-pressed="true"]{background:var(--graphite);color:var(--on-graphite)}
.menubtn{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 6px;border:0;border-radius:var(--r-control);background:none}
.menubtn:hover{background:var(--vellum-2)}
.mark{width:22px;height:22px;fill:var(--graphite)}
.undo-group{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:20px;background:var(--rule);margin:0 6px}
.tools{display:flex;align-items:center;gap:2px;padding:3px;border-radius:5px;background:var(--vellum-2)}
.tools .iconbtn:hover{background:var(--vellum-3)}
.tools .iconbtn[aria-pressed="true"]{background:var(--graphite)}
.cmdfield{display:flex;align-items:center;gap:8px;width:min(300px,100%);height:32px;padding:0 8px 0 9px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--field);color:var(--lead);text-align:left}
.cmdfield:hover{border-color:var(--graphite)}
.cmdfield span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdfield .short{display:none}
.kbd{font:400 12px/1 var(--font-narrow);color:var(--lead);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:none;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--vellum-2)}
.btn-primary{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.btn-primary:hover{background:var(--graphite);opacity:.9}
.only-narrow{display:none}

/* library */
.library{grid-area:lib;display:flex;flex-direction:column;min-height:0;background:var(--vellum)}
.lib-search{padding:6px 10px 10px 12px}
.field{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--field);color:var(--lead)}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--graphite);outline:none}
.field input::placeholder{color:var(--lead)}
.lib-scroll{flex:1;overflow:auto;padding:0 6px 16px 8px;scrollbar-width:thin}
.lib-sec+.lib-sec{margin-top:2px}
.lib-head{display:flex;align-items:center;gap:4px;width:100%;height:30px;padding:0 6px 0 2px;border:0;border-radius:var(--r-control);background:none;font-weight:700;text-align:left}
.lib-head:hover{background:var(--vellum-2)}
.lib-head .count{margin-left:auto;font:400 12px var(--font-narrow);color:var(--lead)}
.chev{width:16px;height:16px;transition:transform .14s ease}
.lib-head[aria-expanded="true"] .chev,.sec-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:2px 2px 10px}
.tile{display:grid;place-items:center;aspect-ratio:1;padding:0;border:0;border-radius:var(--r-control);background:none;color:var(--graphite);cursor:grab}
.tile:hover{background:var(--vellum-2)}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.lib-note{margin:0;padding:2px 8px 12px 22px;color:var(--lead)}
.lib-foot{padding:10px 12px 12px}
.lib-foot .btn{width:100%;justify-content:center;font-weight:400}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--board);border-radius:8px 8px 0 0}
.ruler{position:absolute;z-index:2;background:var(--vellum)}
.ruler-x{top:0;left:22px;right:0;height:22px;box-shadow:inset 0 -1px 0 var(--rule)}
.ruler-y{top:22px;left:0;bottom:0;width:22px;box-shadow:inset -1px 0 0 var(--rule)}
.ruler-corner{top:0;left:0;width:22px;height:22px;box-shadow:inset -1px -1px 0 var(--rule)}
.ruler svg{width:100%;height:100%;overflow:hidden}
.ruler line{stroke:var(--lead);stroke-width:1;opacity:.55}
.ruler text{font:400 10px var(--font-narrow);fill:var(--lead)}
.ruler .band{fill:var(--ink-wash)}
.ruler .band-edge{stroke:var(--ink);opacity:1}
#canvas{position:absolute;top:22px;left:22px;width:calc(100% - 22px);height:calc(100% - 22px);touch-action:none;outline:none}
#canvas.hand{cursor:grab}
#canvas.panning{cursor:grabbing}
#canvas.place{cursor:crosshair}
.no-grid .grid{display:none}

/* diagram marks: user content, uses the diagram font */
.node{cursor:move}
.shape{stroke-width:1.25}
.sw-mist{fill:var(--mist-f);stroke:var(--mist-s)}
.sw-sage{fill:var(--sage-f);stroke:var(--sage-s)}
.sw-ochre{fill:var(--ochre-f);stroke:var(--ochre-s)}
.sw-rose{fill:var(--rose-f);stroke:var(--rose-s)}
.sw-lilac{fill:var(--lilac-f);stroke:var(--lilac-s)}
.sw-stone{fill:var(--stone-f);stroke:var(--stone-s)}
.sw-none{fill:var(--sheet);stroke:var(--diagram-text)}
.node .detail{fill:none}
.node .stroke-only{fill:none;stroke:var(--diagram-text);stroke-width:1.5}
.node .container-body{fill:transparent}
.node .text-hit{fill:transparent;stroke:none}
.label{font:12px var(--font-diagram);fill:var(--diagram-text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.label-head{font-weight:700;text-anchor:start}
.edge{fill:none;stroke:var(--edge);stroke-width:1.25}
.arrowhead{fill:var(--edge)}
.edge-label-bg{fill:var(--sheet)}
.edge-label{font:11px var(--font-diagram);fill:var(--diagram-text);text-anchor:middle;dominant-baseline:central;pointer-events:none}

/* construction layer: editor marks that never print */
#construct{pointer-events:none}
.guide{stroke:var(--guide);stroke-width:1;stroke-dasharray:4 3}
.dim{stroke:var(--ink);stroke-width:1}
.dim-ext{stroke:var(--ink);stroke-width:1;opacity:.55}
.chip{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.chip-eq{fill:var(--ink);stroke:var(--ink)}
.chip-text{font:700 11px var(--font-narrow);fill:var(--ink);text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
.chip-eq+.chip-text{fill:var(--sheet)}
.sel-box{fill:none;stroke:var(--ink);stroke-width:1}
.handle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;pointer-events:all}
.handle[data-handle="n"],.handle[data-handle="s"]{cursor:ns-resize}
.handle[data-handle="e"],.handle[data-handle="w"]{cursor:ew-resize}
.handle[data-handle="nw"],.handle[data-handle="se"]{cursor:nwse-resize}
.handle[data-handle="ne"],.handle[data-handle="sw"]{cursor:nesw-resize}
.rot-stem{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2}
.nub{pointer-events:all;cursor:pointer}
.nub circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.nub path{stroke:var(--ink);stroke-width:1.25;stroke-linecap:round}
.nub:hover circle{fill:var(--ink)}
.nub:hover path{stroke:var(--sheet)}
.hover-box{fill:none;stroke:var(--guide);stroke-width:1}

/* title block: the drawing's identity, page, and view state */
.titleblock{position:absolute;right:14px;bottom:14px;z-index:3;display:grid;grid-template-columns:auto auto auto minmax(148px,auto);background:var(--vellum);border:1.5px solid var(--graphite)}
.tb-cell{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:4px 10px 6px;border-left:1px solid var(--rule-strong);border-top:1px solid var(--rule-strong)}
.tb-cell:first-child,.tb-row2-first{border-left:0}
.tb-title{grid-column:1 / 4;border-top:0}
.tb-page{grid-column:4;grid-row:1 / 3;border-top:0;justify-content:center;gap:4px}
.tb-page-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb-label{font:400 11px/13px var(--font-narrow);color:var(--lead)}
.tb-value{display:flex;align-items:center;gap:4px;padding:0;border:0;background:none;font-weight:700;line-height:18px;text-align:left;white-space:nowrap}
button.tb-value{border-radius:2px}
button.tb-value:hover{color:var(--ink)}
.tb-name{font:700 14px/20px var(--font-wide);letter-spacing:.01em}
.tb-zoom{display:flex;align-items:center;gap:2px}
.tb-zoom .iconbtn{width:22px;height:20px}
.tb-zoom output{min-width:40px;text-align:center;font:700 13px/18px var(--font-narrow);font-variant-numeric:tabular-nums}
.tb-pager{display:flex;gap:2px;margin-right:-6px}
.tb-pager .iconbtn{width:22px;height:20px}
.tb-pager .icon,.tb-zoom .icon{width:16px;height:16px}

/* inspector */
.inspector{grid-area:insp;min-height:0;overflow:auto;background:var(--vellum);scrollbar-width:thin}
.insp-head{display:flex;align-items:flex-start;gap:8px;padding:6px 10px 12px 16px}
.insp-title{flex:1;min-width:0}
.insp-name{margin:0;font:700 14px/20px var(--font-wide);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-kind{margin:2px 0 0;color:var(--lead)}
.sec{border-top:1px solid var(--rule)}
.sec-head{display:flex;align-items:center;gap:4px;width:100%;height:36px;padding:0 10px 0 12px;border:0;background:none;font-weight:700;text-align:left}
.sec-head:hover{background:var(--vellum-2)}
.sec-head .aside{margin-left:auto;font-weight:400;color:var(--lead)}
.sec-body{display:grid;gap:8px;padding:2px 16px 16px}
.sec-head[aria-expanded="false"]+.sec-body{display:none}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px}
.lbl{color:var(--lead)}
.ctl{display:flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 8px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--field)}
.ctl:focus-within{border-color:var(--ink)}
.ctl input,.ctl select{flex:1;min-width:0;height:100%;border:0;background:none;outline:none}
.ctl select{appearance:none;cursor:pointer}
.ctl .icon{width:16px;height:16px;color:var(--lead)}
.hex{font:400 13px var(--font-narrow);font-variant-numeric:tabular-nums}
.well{flex:none;width:16px;height:16px;border-radius:2px;border:1.5px solid}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.num b{flex:none;width:12px;font:400 12px var(--font-narrow);color:var(--lead)}
.num input{font:400 14px var(--font-narrow);font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw{aspect-ratio:1;padding:0;border:1.5px solid;border-radius:var(--r-control)}
.sw[aria-pressed="true"]{outline:2px solid var(--graphite);outline-offset:2px}
.sw:focus-visible{outline-color:var(--ink)}
.sw-btn-none{background:linear-gradient(to top right,transparent calc(50% - 1px),var(--redline) calc(50% - .5px),var(--redline) calc(50% + .5px),transparent calc(50% + 1px)),var(--sheet);border-color:var(--rule-strong)}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--field);overflow:hidden}
.seg button{flex:1;display:grid;place-items:center;height:26px;min-width:28px;padding:0;border:0;background:none}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--vellum-3)}
.seg .icon{width:18px;height:18px}
.seg b,.seg i,.seg u{font-family:var(--font-diagram);font-size:13px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:14px;height:14px;margin:0;accent-color:var(--graphite)}
.order{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.order .btn{justify-content:center;font-weight:400;height:28px;padding:0 8px}
.props{display:grid;gap:0;border:1px solid var(--rule);border-radius:var(--r-control);background:var(--field)}
.prop{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:5px 8px}
.prop+.prop{border-top:1px solid var(--rule)}
.prop dt{color:var(--lead)}
.prop dd{margin:0}
.linkbtn{justify-self:start;padding:2px 0;border:0;background:none;color:var(--graphite);font-weight:700}
.linkbtn:hover{color:var(--ink)}

/* popovers, palette, toast */
.pop{position:fixed;z-index:40;min-width:220px;padding:6px;background:var(--vellum);border:1px solid var(--rule-strong);border-radius:var(--r-pop);box-shadow:var(--pop-shadow);transform-origin:var(--origin,top left);animation:pop-in .12s ease-out}
.pop[hidden]{display:none}
@keyframes pop-in{from{opacity:0;transform:scale(.97)}}
.pop-title{margin:2px 8px 6px;font-weight:700}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border:0;border-radius:var(--r-control);background:none;text-align:left;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--vellum-3)}
.mi .kbd{margin-left:auto}
.mi .icon{width:18px;height:18px;color:var(--lead)}
.mi[aria-current="page"]{font-weight:700}
.mi-danger{color:var(--redline)}
.pop hr{height:1px;margin:6px 4px;border:0;background:var(--rule)}
.pop .check{padding:6px 8px}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(22,29,26,.30)}
.scrim[hidden]{display:none}
.palette{position:absolute;left:50%;top:12vh;width:min(620px,calc(100vw - 24px));transform:translateX(-50%);overflow:hidden;background:var(--vellum);border:1px solid var(--rule-strong);border-radius:var(--r-pop);box-shadow:var(--pop-shadow);animation:pal-in .14s ease-out}
@keyframes pal-in{from{opacity:0;transform:translate(-50%,-6px)}}
.pal-input{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--rule)}
.pal-input input{flex:1;height:100%;border:0;background:none;font-size:18px;outline:none}
.pal-input input::placeholder{color:var(--lead)}
.scope{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 8px;border:0;border-radius:var(--r-control);background:var(--vellum-3);font-weight:700}
.scope[hidden]{display:none}
.scope .icon{width:14px;height:14px}
.pal-list{max-height:min(440px,62vh);overflow:auto;padding:6px}
.pal-group{padding:10px 10px 4px;color:var(--lead)}
.pal-item{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-control);cursor:pointer}
.pal-item[aria-selected="true"]{background:var(--vellum-3)}
.pal-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;color:var(--lead)}
.pal-item .where{color:var(--lead)}
.pal-empty{margin:0;padding:18px 12px;color:var(--lead)}
.pal-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--rule);color:var(--lead)}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translateX(-50%);padding:9px 14px;border-radius:var(--r-control);background:var(--graphite);color:var(--on-graphite);box-shadow:var(--pop-shadow)}
.toast[hidden]{display:none}

@media (max-width:1180px){:root{--lib-w:216px;--insp-w:256px}.cmdfield{width:150px}.cmdfield .long{display:none}.cmdfield .short{display:block}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr) var(--insp-w);grid-template-areas:"top top" "stage insp"}
  .library{position:fixed;top:48px;left:0;bottom:0;z-index:30;width:280px;box-shadow:var(--pop-shadow);transform:translateX(-105%);transition:transform .18s ease}
  .show-library .library{transform:none}
  .only-narrow{display:inline-grid}
  .tools .wide-only:not(#insertBtn){display:none}
  .stage{border-radius:8px 0 0 0}
  .btn-share{display:none}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage"}
  .topbar{grid-template-columns:auto 1fr auto;gap:6px;padding:0 6px}
  .tools{justify-self:center}
  .tools .wide-only,.tb-left .undo-group,.cmdfield span,.cmdfield .short,.cmdfield .kbd,.btn-export span{display:none}
  .cmdfield{width:32px;padding:0;justify-content:center;border:0;background:none;color:var(--graphite)}
  .btn-export{width:32px;padding:0;justify-content:center}
  .stage{border-radius:0}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// shape registry: one geometry source for the canvas, library tiles, and palette icons
const SHAPES = {
  rect: { name: "Rectangle", size: [120, 60], d: (x, y, w, h) => `M${x} ${y}H${x + w}V${y + h}H${x}Z` },
  rounded: { name: "Rounded rectangle", size: [120, 60], d: (x, y, w, h) => roundRect(x, y, w, h, Math.min(10, w / 4, h / 4)) },
  stadium: { name: "Terminator", size: [120, 50], d: (x, y, w, h) => roundRect(x, y, w, h, Math.min(h / 2, w / 2)) },
  ellipse: { name: "Ellipse", size: [120, 80], d: (x, y, w, h) => `M${x} ${y + h / 2}a${w / 2} ${h / 2} 0 1 0 ${w} 0a${w / 2} ${h / 2} 0 1 0 ${-w} 0Z` },
  circle: { name: "Circle", size: [80, 80], tile: [4, 4, 22, 22], d: (x, y, w, h) => `M${x} ${y + h / 2}a${w / 2} ${h / 2} 0 1 0 ${w} 0a${w / 2} ${h / 2} 0 1 0 ${-w} 0Z` },
  diamond: { name: "Decision", size: [110, 80], d: (x, y, w, h) => `M${x + w / 2} ${y}L${x + w} ${y + h / 2}L${x + w / 2} ${y + h}L${x} ${y + h / 2}Z` },
  triangle: { name: "Triangle", size: [80, 70], d: (x, y, w, h) => `M${x + w / 2} ${y}L${x + w} ${y + h}H${x}Z` },
  hexagon: { name: "Preparation", size: [120, 60], d: (x, y, w, h) => { const s = Math.min(w / 4, h / 2); return `M${x + s} ${y}H${x + w - s}L${x + w} ${y + h / 2}L${x + w - s} ${y + h}H${x + s}L${x} ${y + h / 2}Z`; } },
  parallelogram: { name: "Data", size: [120, 60], d: (x, y, w, h) => { const s = Math.min(w * .2, 20); return `M${x + s} ${y}H${x + w}L${x + w - s} ${y + h}H${x}Z`; } },
  trapezoid: { name: "Trapezoid", size: [120, 60], d: (x, y, w, h) => { const s = Math.min(w * .2, 20); return `M${x + s} ${y}H${x + w - s}L${x + w} ${y + h}H${x}Z`; } },
  manualop: { name: "Manual operation", size: [120, 60], d: (x, y, w, h) => { const s = Math.min(w * .2, 20); return `M${x} ${y}H${x + w}L${x + w - s} ${y + h}H${x + s}Z`; } },
  step: { name: "Step", size: [120, 60], d: (x, y, w, h) => { const s = Math.min(w * .2, h / 2); return `M${x} ${y}H${x + w - s}L${x + w} ${y + h / 2}L${x + w - s} ${y + h}H${x}L${x + s} ${y + h / 2}Z`; } },
  cylinder: { name: "Database", size: [100, 100], d: (x, y, w, h) => { const r = Math.min(h * .12, 10); return `M${x} ${y + r}a${w / 2} ${r} 0 0 1 ${w} 0V${y + h - r}a${w / 2} ${r} 0 0 1 ${-w} 0Z`; }, detail: (x, y, w, h) => { const r = Math.min(h * .12, 10); return `M${x} ${y + r}a${w / 2} ${r} 0 0 0 ${w} 0`; } },
  queue: { name: "Queue", size: [150, 60], d: (x, y, w, h) => { const r = Math.min(w * .08, 10); return `M${x + r} ${y}H${x + w - r}a${r} ${h / 2} 0 0 1 0 ${h}H${x + r}a${r} ${h / 2} 0 0 1 0 ${-h}Z`; }, detail: (x, y, w, h) => { const r = Math.min(w * .08, 10); return `M${x + w - r} ${y}a${r} ${h / 2} 0 0 0 0 ${h}`; } },
  document: { name: "Document", size: [120, 70], d: (x, y, w, h) => { const a = Math.min(h * .1, 7); return `M${x} ${y}H${x + w}V${y + h - a}Q${x + w * .75} ${y + h - 3 * a} ${x + w / 2} ${y + h - a}T${x} ${y + h - a}Z`; } },
  note: { name: "Note", size: [160, 90], d: (x, y, w, h) => { const f = Math.min(14, w / 5, h / 4); return `M${x} ${y}H${x + w - f}L${x + w} ${y + f}V${y + h}H${x}Z`; }, detail: (x, y, w, h) => { const f = Math.min(14, w / 5, h / 4); return `M${x + w - f} ${y}V${y + f}H${x + w}`; } },
  delay: { name: "Delay", size: [110, 60], d: (x, y, w, h) => { const r = Math.min(h / 2, w / 2); return `M${x} ${y}H${x + w - r}a${r} ${h / 2} 0 0 1 0 ${h}H${x}Z`; } },
  offpage: { name: "Off-page reference", size: [70, 70], d: (x, y, w, h) => `M${x} ${y}H${x + w}V${y + h * .6}L${x + w / 2} ${y + h}L${x} ${y + h * .6}Z` },
  manualin: { name: "Manual input", size: [120, 60], d: (x, y, w, h) => `M${x} ${y + h * .3}L${x + w} ${y}V${y + h}H${x}Z` },
  cloud: { name: "Cloud", size: [130, 80], d: (x, y, w, h) => { const P = (u, v) => `${x + u * w} ${y + v * h}`; return `M${P(.25, .9)}C${P(.03, .9)} ${P(0, .56)} ${P(.18, .5)}C${P(.12, .2)} ${P(.45, .08)} ${P(.55, .3)}C${P(.65, .06)} ${P(.97, .14)} ${P(.88, .47)}C${P(1.03, .55)} ${P(1, .9)} ${P(.78, .9)}Z`; } },
  cube: { name: "Cube", size: [100, 90], d: (x, y, w, h) => { const k = Math.min(w, h) * .2; return `M${x} ${y + k}L${x + k} ${y}H${x + w}V${y + h - k}L${x + w - k} ${y + h}H${x}Z`; }, detail: (x, y, w, h) => { const k = Math.min(w, h) * .2; return `M${x} ${y + k}H${x + w - k}V${y + h}M${x + w - k} ${y + k}L${x + w} ${y}`; } },
  callout: { name: "Callout", size: [130, 80], d: (x, y, w, h) => `M${x} ${y}H${x + w}V${y + h * .72}H${x + w * .45}L${x + w * .28} ${y + h}V${y + h * .72}H${x}Z` },
  process: { name: "Predefined process", size: [130, 60], d: (x, y, w, h) => `M${x} ${y}H${x + w}V${y + h}H${x}Z`, detail: (x, y, w, h) => { const b = Math.min(w * .1, 12); return `M${x + b} ${y}V${y + h}M${x + w - b} ${y}V${y + h}`; } },
  arrow: { name: "Block arrow", size: [120, 60], d: (x, y, w, h) => { const k = Math.min(w * .38, h); return `M${x} ${y + h * .3}H${x + w - k}V${y}L${x + w} ${y + h / 2}L${x + w - k} ${y + h}V${y + h * .7}H${x}Z`; } },
  actor: { name: "Actor", size: [40, 70], strokeOnly: true, labelBelow: true, d: (x, y, w, h) => { const r = Math.min(w, h) * .18, cx = x + w / 2; return `M${cx - r} ${y + r}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0ZM${cx} ${y + 2 * r}V${y + h * .62}M${x} ${y + h * .38}H${x + w}M${cx} ${y + h * .62}L${x} ${y + h}M${cx} ${y + h * .62}L${x + w} ${y + h}`; } },

$("#libList").addEventListener("dragstart", e => {

  if (tile) { e.dataTransfer.setData("text/x-shape", tile.dataset.shape); e.dataTransfer.effectAllowed = "copy"; }
});
$("#libFilter").addEventListener("input", e => renderLibrary(e.target.value));
$("#libFilter").addEventListener("keydown", e => { if (e.key === "Enter") toast("Searching every library needs the shape index, which this mockup doesn't include."); });

// popovers
const pop = $("#pop");
let popAnchor = null;
function openPop(anchor, html, align = "left", above = false) {
  if (popAnchor === anchor) { closePop(); return; }
  closePop();
  pop.innerHTML = html; pop.hidden = false; popAnchor = anchor;
  anchor.setAttribute("aria-expanded", "true");
  const r = anchor.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  let left = align === "right" ? r.right - pr.width : r.left;
  left = Math.max(8, Math.min(left, innerWidth - pr.width - 8));
  const top = above ? r.top - pr.height - 6 : r.bottom + 6;
  pop.style.left = `${left}px`; pop.style.top = `${Math.max(8, top)}px`;
  pop.style.setProperty("--origin", `${align === "right" ? "right" : "left"} ${above ? "bottom" : "top"}`);
  const first = pop.querySelector("button"); if (first) first.focus({ preventScroll: true });
}
function closePop() {
  if (!popAnchor) return;
  popAnchor.setAttribute("aria-expanded", "false");
  pop.hidden = true; popAnchor = null;
}
document.addEventListener("pointerdown", e => { if (popAnchor && !pop.contains(e.target) && !popAnchor.contains(e.target)) closePop(); });
const mi = (label, attrs = "", kbd = "", icon = "") => `<button class="mi" role="menuitem" ${attrs}>${icon ? `<svg class="icon"><use href="#${icon}"/></svg>` : ""}${label}${kbd ? `<span class="kbd">${kbd}</span>` : ""}</button>`;

$("#menuBtn").addEventListener("click", e => openPop(e.currentTarget, ["File", "Edit", "View", "Arrange", "Extras", "Help"].map(g => mi(g, `data-scope="${g}"`, "", "")).join("") + "<hr>" + mi("Keyboard shortcuts", 'data-run="shortcuts"', "⌘/")));
$("#insertBtn").addEventListener("click", e => openPop(e.currentTarget, `<p class="pop-title">Insert</p>` + [["Shape", "⌘⇧K"], ["Table", ""], ["Image", "⌘⇧I"], ["Link", "⌘⇧L"], ["Math formula", ""], ["Template", ""]].map(([l, k]) => mi(l, `data-run="insert:${l}"`, k)).join("") + "<hr>" + [["From text", ""], ["From CSV", ""], ["From Mermaid", ""], ["From PlantUML", ""]].map(([l]) => mi(l, `data-run="insert:${l}"`)).join(""), "left"));
$("#exportBtn").addEventListener("click", e => openPop(e.currentTarget, `<p class="pop-title">Export this page</p>` + ["PNG", "SVG", "PDF", "JPEG", "HTML", "VSDX", "XML"].map(f => mi(`${f}`, `data-run="export:${f}"`)).join("") + `<hr><label class="check"><input type="checkbox" checked>Keep diagram editable in PNG and SVG</label>`, "right"));
$("#pageBtn").addEventListener("click", e => openPop(e.currentTarget, PAGES.map((p, i) => `<button class="mi" role="menuitem" data-page="${i}" ${i === ui.page ? 'aria-current="page"' : ""}><svg class="icon"><use href="#i-page"/></svg>${p}</button>`).join("") + "<hr>" + mi("Add page", 'data-run="addpage"', "", "i-plus") + mi("Duplicate page", 'data-run="duppage"') + mi("Rename page", 'data-run="renamepage"') + `<button class="mi mi-danger" role="menuitem" data-run="delpage">Delete page</button>`, "right", true));
$("#layerBtn").addEventListener("click", e => openPop(e.currentTarget, `<p class="pop-title">Layers</p>` + ["Annotations", "Services", "Background"].map(l => `<button class="mi" role="menuitem" ${l === "Services" ? 'aria-current="page"' : ""}><svg class="icon"><use href="#i-layers"/></svg>${l}${l === "Background" ? '<span class="kbd"><svg class="icon" style="width:14px;height:14px"><use href="#i-lock"/></svg></span>' : ""}</button>`).join("") + "<hr>" + mi("Add layer", 'data-run="addlayer"', "", "i-plus"), "left", true));
$("#historyBtn").addEventListener("click", () => toast("Revision history opens here: 14 saved revisions."));
$("#docName").addEventListener("click", () => toast("Rename the drawing inline here."));
$("#shareBtn").addEventListener("click", () => toast("Sharing needs a cloud location. Save the drawing to one first."));
pop.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.scope) { closePop(); openPalette(b.dataset.scope); return; }
  if (b.dataset.page) { ui.page = +b.dataset.page; closePop(); renderAll(); return; }
  if (b.dataset.run) { closePop(); run(b.dataset.run, b.textContent.trim()); }
});
pop.addEventListener("keydown", e => {
  const items = $$(".mi", pop), i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});

// command registry: one list feeds the menu, the palette, and shortcuts
const COMMANDS = [
  ["File", "New drawing", "⌘N"], ["File", "Open", "⌘O"], ["File", "Save", "⌘S"], ["File", "Save as", "⇧⌘S"], ["File", "Import", "⌘⇧O"],
  ["File", "Export as PNG", "", "export:PNG"], ["File", "Export as SVG", "", "export:SVG"], ["File", "Export as PDF", "", "export:PDF"], ["File", "Export as VSDX", "", "export:VSDX"],
  ["File", "Page setup", ""], ["File", "Print", "⌘P"], ["File", "Revision history", ""], ["File", "Properties", ""],
  ["Edit", "Undo", "⌘Z", "undo"], ["Edit", "Redo", "⇧⌘Z", "redo"], ["Edit", "Duplicate", "⌘D", "duplicate"], ["Edit", "Delete", "⌫", "delete"],
  ["Edit", "Select all", "⌘A"], ["Edit", "Select shapes", "⇧⌘I"], ["Edit", "Select connectors", "⇧⌘E"], ["Edit", "Find and replace", "⌘F"],
  ["Edit", "Edit style", "⌘E"], ["Edit", "Edit data", "⌘M"], ["Edit", "Edit tooltip", ""], ["Edit", "Edit link", "⌥⇧L"], ["Edit", "Lock or unlock", "⌘L"],
  ["View", "Zoom in", "⌘+", "zoomin"], ["View", "Zoom out", "⌘−", "zoomout"], ["View", "Zoom to fit", "⇧⌘H", "fit"], ["View", "Show grid", "⌘'", "grid"],
  ["View", "Rulers", ""], ["View", "Page view", ""], ["View", "Outline", "⇧⌘O"], ["View", "Layers", "⇧⌘L"], ["View", "Connection points", ""], ["View", "Dark theme", "", "theme"], ["View", "Full screen", ""],
  ["Arrange", "Bring to front", "⇧⌘]", "front"], ["Arrange", "Send to back", "⇧⌘[", "back"], ["Arrange", "Group", "⌘G"], ["Arrange", "Ungroup", "⇧⌘G"],
  ["Arrange", "Align left edges", "⌥⌘←"], ["Arrange", "Align centers", "⌥⌘H"], ["Arrange", "Align top edges", "⌥⌘↑"], ["Arrange", "Distribute horizontally", ""], ["Arrange", "Distribute vertically", ""],
  ["Arrange", "Rotate 90°", "⌘R"], ["Arrange", "Flip horizontally", ""], ["Arrange", "Flip vertically", ""], ["Arrange", "Autosize", "⇧⌘Y"],
  ["Arrange", "Vertical tree layout", ""], ["Arrange", "Horizontal tree layout", ""], ["Arrange", "Radial tree layout", ""], ["Arrange", "Organic layout", ""], ["Arrange", "Circle layout", ""], ["Arrange", "Flow layout", ""],
  ["Extras", "Edit diagram XML", ""], ["Extras", "Plugins", ""], ["Extras", "Sketch style", ""], ["Extras", "Math typesetting", ""], ["Extras", "Configuration", ""],
  ["Help", "Keyboard shortcuts", "⌘/", "shortcuts"], ["Help", "Documentation", ""], ["Help", "Report a problem", ""],
].map(([group, label, kbd, id]) => ({ group, label, kbd, id }));

let palScope = null, palItems = [], palIndex = 0;
function openPalette(scope = null) {
  closePop();
  palScope = scope;
  $("#scrim").hidden = false;
  $("#palScope").hidden = !scope;
  $("#palScopeName").textContent = scope || "";
  $("#palInput").value = "";
  renderPalette();
  $("#palInput").focus();
}
function closePalette() { $("#scrim").hidden = true; canvas.focus({ preventScroll: true }); }
function renderPalette() {
  const q = $("#palInput").value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
  const match = s => words.every(w => s.toLowerCase().includes(w));
  const cmds = COMMANDS.filter(c => (!palScope || c.group === palScope) && match(`${c.label} ${c.group}`));
  const shapes = palScope || !q ? [] : Object.entries(SHAPES).filter(([k, s]) => !s.connector && match(`${s.name} shape ${k}`)).slice(0, 6);
  palItems = [...shapes.map(([k, s]) => ({ shape: k, label: s.name })), ...cmds];
  palIndex = Math.min(palIndex, Math.max(0, palItems.length - 1));
  let html = "", i = 0;
  if (shapes.length) html += `<div class="pal-group">Shapes</div>` + shapes.map(([k, s]) => `<div class="pal-item" role="option" data-i="${i}" aria-selected="${i++ === palIndex}"><svg viewBox="0 0 30 30">${tileArt(k)}</svg><span>${s.name}</span><span class="where">Insert</span></div>`).join("");
  const groups = [...new Set(cmds.map(c => c.group))];
  for (const g of groups) {
    html += `<div class="pal-group">${g}</div>`;
    for (const c of cmds.filter(c => c.group === g)) html += `<div class="pal-item" role="option" data-i="${i}" aria-selected="${i++ === palIndex}"><span></span><span>${c.label}</span><span class="kbd">${c.kbd || ""}</span></div>`;
  }
  $("#palList").innerHTML = html || `<p class="pal-empty">Nothing matches “${esc($("#palInput").value)}”. Try one word, such as “align” or “cylinder”.</p>`;
  const cur = $(`.pal-item[aria-selected="true"]`); if (cur) cur.scrollIntoView({ block: "nearest" });
}
function runPalette(i) {
  const it = palItems[i];
  if (!it) return;
  closePalette();
  if (it.shape) { const [cx, cy] = visibleCenter(); addNode(it.shape, cx, cy); return; }
  run(it.id || "", it.label);
}
$("#palInput").addEventListener("input", () => { palIndex = 0; renderPalette(); });
$("#palInput").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); palIndex = Math.min(palItems.length - 1, palIndex + 1); renderPalette(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palIndex = Math.max(0, palIndex - 1); renderPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); runPalette(palIndex); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  else if (e.key === "Backspace" && !e.target.value && palScope) { palScope = null; $("#palScope").hidden = true; renderPalette(); }
});
$("#palList").addEventListener("click", e => { const it = e.target.closest("[data-i]"); if (it) runPalette(+it.dataset.i); });
$("#palScope").addEventListener("click", () => { palScope = null; $("#palScope").hidden = true; renderPalette(); $("#palInput").focus(); });
$("#scrim").addEventListener("pointerdown", e => { if (e.target.id === "scrim") closePalette(); });
$("#cmdBtn").addEventListener("click", () => openPalette());

function run(id, label) {
  const n = ui.sel && byId(ui.sel);
  switch (id) {
    case "undo": return undo();
    case "redo": return redo();
    case "zoomin": return zoomStep(1);
    case "zoomout": return zoomStep(-1);
    case "fit": return fit();
    case "grid": canvas.classList.toggle("no-grid"); return renderInspector();
    case "theme": return toggleTheme();
    case "delete": return deleteSel();
    case "duplicate": if (n) { const before = snapshot(), m = { ...n, id: `n${Date.now().toString(36)}`, x: n.x + 20, y: n.y + 20 }; doc.nodes.push(m); ui.sel = m.id; commit(before); renderAll(); } return;
    case "front": case "back": if (n) $(`[data-order="${id}"]`)?.click(); return;
    case "addpage": PAGES.push(`Page ${PAGES.length + 1}`); ui.page = PAGES.length - 1; renderAll(); return toast(`Added ${PAGES[ui.page]}.`);
  }
  if (id.startsWith("export:")) return toast(`Exported “Greendale enrollment system.${id.slice(7).toLowerCase()}”.`);
  toast(`“${label}” isn't wired up in this mockup.`);
}
function deleteSel() {
  if (!ui.sel) return;
  const before = snapshot();
  doc.nodes.splice(doc.nodes.indexOf(byId(ui.sel)), 1);
  for (let i = doc.edges.length - 1; i >= 0; i--) if (doc.edges[i].from === ui.sel || doc.edges[i].to === ui.sel) doc.edges.splice(i, 1);
  ui.sel = null;
  commit(before); renderAll();
}

// tools, theme, toast, keyboard
function setTool(t) { ui.tool = t; renderChrome(); }
$$("[data-tool]").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const label = dark ? "Switch to light theme" : "Switch to dark theme";
  $("#themeBtn").title = label; $("#themeBtn").setAttribute("aria-label", label);
  renderInspector();
}
$("#themeBtn").addEventListener("click", toggleTheme);
$("#undoBtn").addEventListener("click", undo);
$("#redoBtn").addEventListener("click", redo);
$("#zoomIn").addEventListener("click", () => zoomStep(1));
$("#zoomOut").addEventListener("click", () => zoomStep(-1));
$("#pagePrev").addEventListener("click", () => { ui.page = (ui.page - 1 + PAGES.length) % PAGES.length; renderAll(); });
$("#pageNext").addEventListener("click", () => { ui.page = (ui.page + 1) % PAGES.length; renderAll(); });
$("#libToggle").addEventListener("click", e => { const on = $("#app").classList.toggle("show-library"); e.currentTarget.setAttribute("aria-expanded", String(on)); });
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

const typing = el => el && (el.tagName === "INPUT" || el.tagName === "SELECT" || el.isContentEditable);
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#scrim").hidden ? openPalette() : closePalette(); return; }
  if (!$("#scrim").hidden) return;
  if (e.key === "Escape") { if (popAnchor) { const a = popAnchor; closePop(); a.focus(); } else { ui.sel = null; ui.demo = false; renderAll(); } return; }
  if (typing(document.activeElement)) return;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); run("duplicate"); return; }
  if (mod && (e.key === "=" || e.key === "+")) { e.preventDefault(); zoomStep(1); return; }
  if (mod && e.key === "-") { e.preventDefault(); zoomStep(-1); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === "h") { e.preventDefault(); fit(); return; }
  if (mod) return;
  if (e.key === " " && !ui.space) { ui.space = true; renderChrome(); e.preventDefault(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && ui.sel) { e.preventDefault(); deleteSel(); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && ui.sel) {
    e.preventDefault();
    const before = snapshot(), n = byId(ui.sel), s = e.shiftKey ? 10 : 1;
    n.x += arrows[e.key][0] * s; n.y += arrows[e.key][1] * s; ui.demo = false;
    commit(before); render(); syncArrange(); return;
  }
  const tools = { v: "select", h: "hand", r: "rect", e: "ellipse", t: "text", c: "connector", p: "pen" };
  if (tools[e.key.toLowerCase()]) setTool(tools[e.key.toLowerCase()]);
});
document.addEventListener("keyup", e => { if (e.key === " ") { ui.space = false; renderChrome(); } });
addEventListener("resize", render);

renderSheet();
renderLibrary();
document.fonts.ready.then(() => { fit(); renderAll(); });
</script>
</body>
</html>
