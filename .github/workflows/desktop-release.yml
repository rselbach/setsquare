# Builds the macOS desktop app, signs and notarizes it, and publishes it as a
# GitHub release together with the manifest the app's updater reads.
#
# To release, set the version in setsquare-app/src-tauri/Cargo.toml, commit
# it, and push a matching tag such as desktop-v0.1.0. A tag with a suffix,
# such as desktop-v0.2.0-beta.1, publishes a pre-release, which the updater
# skips. Running the workflow by hand builds and notarizes without publishing.
#
# Repository secrets:
#   APPLE_CERTIFICATE                   Developer ID Application certificate,
#                                       as a base64-encoded .p12
#   APPLE_CERTIFICATE_PASSWORD          password of that .p12
#   APPLE_SIGNING_IDENTITY              the certificate's name, such as
#                                       "Developer ID Application: Name (TEAM)"
#   APPLE_ID                            Apple ID that notarizes the app
#   APPLE_PASSWORD                      app-specific password of that Apple ID
#   APPLE_TEAM_ID                       Apple developer team ID
#   TAURI_SIGNING_PRIVATE_KEY           updater signing key, the key file's
#                                       contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password of that key

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      stem: ${{ steps.version.outputs.stem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the app version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' setsquare-app/src-tauri/Cargo.toml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "Couldn't read the version from Cargo.toml." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "desktop-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match the app version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "stem=Setsquare-${version}-macOS-arm64" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: setsquare-app/src-tauri -> target
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build, sign and notarize the app and DMG
        env:
          # named apart from APPLE_CERTIFICATE so Tauri doesn't import the
          # certificate a second time
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STEM: ${{ steps.version.outputs.stem }}
        run: |
          certificate_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          staging_dir="${RUNNER_TEMP}/dmg"
          bundle_dir="setsquare-app/src-tauri/target/release/bundle/macos"

          cleanup() {
            rm -f "${certificate_path}"
            security delete-keychain "${keychain_path}"
          }
          trap cleanup EXIT

          # a temporary keychain, added to the search list so codesign finds
          # the certificate
          (umask 077; printf '%s' "${CERTIFICATE}" | base64 -D > "${certificate_path}")
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -k "${keychain_path}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          keychains=("${keychain_path}")
          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychains+=("${keychain%\"*}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

          # Tauri signs, notarizes and staples the app, then packs and signs
          # the updater archive
          yarn tauri build --bundles app --ci \
            --config src-tauri/tauri.release.conf.json
          spctl --assess --type execute --verbose=2 "${bundle_dir}/Setsquare.app"

          # Tauri's own DMG script is unreliable on GitHub's runners
          mkdir -p "${staging_dir}"
          ditto "${bundle_dir}/Setsquare.app" "${staging_dir}/Setsquare.app"
          ln -s /Applications "${staging_dir}/Applications"
          hdiutil create -volname Setsquare -srcfolder "${staging_dir}" \
            -format UDZO -ov "${STEM}.dmg"
          codesign --force --timestamp --sign "${APPLE_SIGNING_IDENTITY}" \
            --keychain "${keychain_path}" "${STEM}.dmg"
          xcrun notarytool submit "${STEM}.dmg" --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
          xcrun stapler staple "${STEM}.dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "${STEM}.dmg"

          mv "${bundle_dir}/Setsquare.app.tar.gz" "${STEM}.app.tar.gz"
          mv "${bundle_dir}/Setsquare.app.tar.gz.sig" "${STEM}.app.tar.gz.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: |
            ${{ steps.version.outputs.stem }}.dmg
            ${{ steps.version.outputs.stem }}.app.tar.gz
            ${{ steps.version.outputs.stem }}.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: release
      - name: Write the updater manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
          STEM: ${{ needs.build.outputs.stem }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${STEM}.app.tar.gz"
          jq -n \
            --arg version "${VERSION}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "${url}" \
            --rawfile signature "release/${STEM}.app.tar.gz.sig" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {url: $url, signature: $signature}}}' \
            > release/latest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          release_args=(--title "Setsquare ${VERSION}" --generate-notes)
          if [[ "${VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}" release/*
