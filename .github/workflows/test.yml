name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: setsquare
          POSTGRES_PASSWORD: setsquare_test
          POSTGRES_DB: setsquare_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setsquare -d setsquare_backend_test" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://setsquare:setsquare_test@localhost:5432/setsquare_backend_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            setsquare-app/node_modules
            setsquare-server/node_modules
            packages/*/node_modules
            examples/*/node_modules
          key: dependencies-${{ runner.os }}-node24-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc', '.npmrc', '**/patches/**') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test frontend
        if: github.event_name != 'pull_request'
        run: yarn test:app --run
      - name: Test server
        run: yarn test:server
