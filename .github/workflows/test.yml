name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: setsquare
          POSTGRES_PASSWORD: setsquare_test
          POSTGRES_DB: setsquare_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setsquare -d setsquare_backend_test" --health-interval 5s --health-timeout 5s --health-retries 10


    env:
      TEST_DATABASE_URL: postgresql://setsquare:setsquare_test@localhost:5432/setsquare_backend_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            setsquare-app/node_modules
            setsquare-server/node_modules
            packages/*/node_modules
            examples/*/node_modules
          key: dependencies-${{ runner.os }}-node24-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc', '.npmrc', '**/patches/**') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test frontend
        if: github.event_name != 'pull_request'
        run: yarn test:app --run
      - name: Test server
        run: yarn test:server
