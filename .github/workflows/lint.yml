name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            setsquare-app/node_modules
            setsquare-server/node_modules
            packages/*/node_modules
            examples/*/node_modules
          key: dependencies-v2-${{ runner.os }}-node24-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc', '.npmrc', '**/patches/**') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        # --frozen-lockfile ignores workspace package.json files
        # (yarnpkg/yarn#5840), so install and fail if yarn.lock changes
        run: |
          yarn install --non-interactive
          if ! git diff --exit-code -- yarn.lock; then
            echo "yarn.lock is out of date. Run yarn install and commit it." >&2
            exit 1
          fi
      - name: Check formatting
        run: yarn test:other
      - name: Lint code
        run: yarn test:code
      - name: Typecheck frontend
        run: yarn test:typecheck
      - name: Typecheck server
        run: yarn test:server:typecheck
