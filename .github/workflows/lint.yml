name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            setsquare-app/node_modules
            setsquare-server/node_modules
            packages/*/node_modules
            examples/*/node_modules
          key: dependencies-${{ runner.os }}-node24-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc', '.npmrc', '**/patches/**') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check formatting
        run: yarn test:other
      - name: Lint code
        run: yarn test:code
      - name: Typecheck frontend
        run: yarn test:typecheck
      - name: Typecheck server
        run: yarn test:server:typecheck
