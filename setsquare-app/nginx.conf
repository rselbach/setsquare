# Serves the web app's static build. Pages fall back to index.html so links
# straight to a drawing work, while missing assets stay 404 so a stale tab
# never runs index.html as a script.
server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;

  # reserved for the backend
  location /api/ {
    return 404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
