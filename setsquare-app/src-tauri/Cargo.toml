[package]
name = "setsquare"
# Single source of truth for the desktop app version.
version = "0.5.0"
description = "Setsquare desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.9"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
